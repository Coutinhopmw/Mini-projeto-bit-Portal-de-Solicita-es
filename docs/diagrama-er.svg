<text class="sec" x="1134" y="258">Regras do modelo</text>
<text class="nota-t" x="1134" y="282">Código da solicitação</text>
<text class="nota" x="1134" y="299">SOL- + id com 5 dígitos (SOL-00042).</text>
<text class="nota" x="1134" y="315">Derivado, sem coluna [D06].</text>
<text class="nota-t" x="1134" y="339">Status</text>
<text class="nota" x="1134" y="356">ABERTO → EM_ATENDIMENTO → CONCLUIDO. CHECK</text>
<text class="nota" x="1134" y="372">no banco; a transição é validada nos</text>
<text class="nota" x="1134" y="388">services [D03].</text>
<text class="nota-t" x="1134" y="412">Exclusão</text>
<text class="nota" x="1134" y="429">Física, só com status ABERTO. O ORM do</text>
<text class="nota" x="1134" y="445">Django apaga o histórico junto (CASCADE)</text>
<text class="nota" x="1134" y="461">[D05].</text>
<text class="nota-t" x="1134" y="485">Categoria em uso</text>
<text class="nota" x="1134" y="502">Só pode ser inativada (PROTECT no ORM; a FK</text>
<text class="nota" x="1134" y="518">no banco também bloqueia) [D07].</text>
<text class="nota-t" x="1134" y="542">Histórico</text>
<text class="nota" x="1134" y="559">A criação grava uma linha com</text>
<text class="nota" x="1134" y="575">status_anterior nulo [D11].</text>
<text class="nota-t" x="1134" y="599">Papéis</text>
<text class="nota" x="1134" y="616">SOLICITANTE ou ATENDENTE [D01].</text>
<text class="nota" x="1134" y="632">administrador = true só para o Django Admin.</text>
<text class="sec" x="1134" y="664">Índices</text>
<text class="nota-t" x="1134" y="688">solicitacoes</text>
<text class="nota" x="1134" y="705">status · categoria_id · criado_em ·</text>
<text class="nota" x="1134" y="721">solicitante_id</text>
<text class="nota-t" x="1134" y="745">historico_status</text>
<text class="nota" x="1134" y="762">solicitacao_id, alterado_em</text>
</svg>
